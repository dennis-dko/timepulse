org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official

# How long Gradle keeps asking a repository that does not answer. On its own it
# asks three times, a second and then two apart, and then disables the
# repository for the rest of the build. So an outage or a rate limit at Maven
# Central of more than three seconds failed the build before its first task, as
# "Plugin ... was not found in any of the following sources". Six attempts from
# two seconds apart wait up to a minute. Only a timeout, a 5xx, a 408 or a 429 is
# asked again; a 404 is an answer. The names are Gradle's internal ones: CI's
# Android job checks that the Gradle in the Dockerfile still reads them.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
